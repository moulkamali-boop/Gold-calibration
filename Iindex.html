        freqRange: { min: 40, max: 60 },

        getNoiseKey() {
            let deviceId = localStorage.getItem('omniPMDev') || 'UNKNOWN';
            let today = new Date().toDateString();
            let hash = 0;
            for (let i = 0; i < deviceId.length; i++) {
                hash = ((hash << 5) - hash) + deviceId.charCodeAt(i);
                hash |= 0;
            }
            for (let i = 0; i < today.length; i++) {
                hash = ((hash << 5) - hash) + today.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash) / 1000000;
        },

        getCalibrationOffset() {
            let session = parseInt(localStorage.getItem('omniSessionID') || '0');
            if (session === 0) {
                session = Math.floor(Math.random() * 10000);
                localStorage.setItem('omniSessionID', session);
            }
            return (session % 100) / 1000;
        },

        dualCheck(nfcReading, acousticReading, tolerance = 0.08) {
            const diff = Math.abs(nfcReading - acousticReading) / Math.max(nfcReading, acousticReading, 0.001);
            return diff <= tolerance;
        },

            try {
                const response = await fetch('https://your-netlify-site.netlify.app/.netlify/functions/get-patch?version=1.0');

                }

                console.log('⏳ تشغيل بالخوارزمية المحلية (بدون تحديث)');
            }
        }

    // ==================== الحالة الأساسية ====================
    let currentLang = localStorage.getItem('omniPMLang') || 'ar';
    let freeUsed = parseInt(localStorage.getItem('omniPMFree') || '0');
    let paid = parseInt(localStorage.getItem('omniPMPaid') || '0');
    let admin = false;
    let selectedMetal = 'gold';
    let selectedKarat = '24';

    const karatOptions = {
        gold: ['24', '22', '21', '18', '14', '9'],
        silver: ['999', '925', '900'],
        platinum: ['999', '950', '900']
    };

    function t(key) { return langMap[currentLang]?.[key] || langMap.en[key] || key; }

    // ==================== الرصيد والمدفوعات ====================
    function totalCredits() { return admin ? 9999 : Math.max(0, 3 - freeUsed) + paid; }
    function updateCreditUI() {
        document.getElementById('creditValue').innerText = totalCredits();
        document.getElementById('creditLabel').innerText = t('creditLabel');
        document.getElementById('creditStrip').innerHTML = `💰 ${t('creditLabel')} <strong>${totalCredits()}</strong>`;
        document.getElementById('adminHint').style.display = admin ? 'block' : 'none';
        document.getElementById('adminHint').innerHTML = admin ? '👑 ' + t('adminActivated') : '';
        document.getElementById('adminSection').style.display = admin ? 'block' : 'none';
        document.getElementById('paySingleBtn').innerHTML = '💵 ' + t('paySingle');
        document.getElementById('payPack5Btn').innerHTML = '💵 ' + t('payPack5');
        document.getElementById('payPack15Btn').innerHTML = '💵 ' + t('payPack15');
    }
    function showToast(msg) { let el=document.getElementById('toast'); el.innerText=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
    function consumeCredit() {
        if(admin) return true;
        let left = Math.max(0, 3 - freeUsed);
        if(left > 0) { freeUsed++; localStorage.setItem('omniPMFree', freeUsed); updateCreditUI(); showToast(t('toastCreditConsumed')); return true; }
        else if(paid > 0) { paid--; localStorage.setItem('omniPMPaid', paid); updateCreditUI(); showToast(t('toastCreditConsumed')); return true; }
        else { showToast(t('toastNoCredit')); return false; }
    }
    function addPaid(amount) { paid += amount; localStorage.setItem('omniPMPaid', paid); updateCreditUI(); showToast(t('toastAdded') + ' ' + amount); }

    document.querySelectorAll('.pay-btn').forEach(btn => {
        btn.onclick = () => {
            let pack = parseInt(btn.dataset.pack);
            let url = pack===1?"https://mouloudkamali.gumroad.com/l/ohwww": (pack===5?"https://mouloudkamali.gumroad.com/l/magfte":"https://mouloudkamali.gumroad.com/l/fhbyhf");
            window.open(url,'_blank');
            setTimeout(() => { if(confirm("هل أكملت الدفع؟")) addPaid(pack); }, 3000);
        };
    });

    document.getElementById('activateBtn').onclick = () => {
        let code = document.getElementById('codeInput').value.trim();
        if(code === 'MOULOUD2026') { admin = true; updateCreditUI(); showToast(t('adminActivated')); }
        else if(code === 'FREE50') { addPaid(50); }
        else showToast(t('invalidCode'));
        document.getElementById('codeInput').value = '';
    };

    // ==================== الوقت، المكان، QR، الجهاز ====================
    function updateDateTime() { let d=new Date(); document.getElementById('date').innerText=d.toLocaleDateString(); document.getElementById('time').innerText=d.toLocaleTimeString(); }
    setInterval(updateDateTime,1000); updateDateTime();
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>document.getElementById('location').innerText=`${p.coords.latitude.toFixed(2)},${p.coords.longitude.toFixed(2)}`,()=>document.getElementById('location').innerText='غير مصرح');
    let devId=localStorage.getItem('omniPMDev'); if(!devId){ devId='PM'+Math.random().toString(36).substr(2,6).toUpperCase(); localStorage.setItem('omniPMDev',devId); } document.getElementById('deviceId').innerText=devId;

    function drawQR() { let c=document.getElementById('qrCanvas'); let ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,44,44); ctx.fillStyle='#000'; for(let i=0;i<7;i++) for(let j=0;j<7;j++) if((i+j)%2===0) ctx.fillRect(i*5+2, j*5+2, 4, 4); }
    drawQR();
    document.getElementById('qrContainer').onclick = () => { navigator.clipboard.writeText(window.location.href); showToast('✅ تم نسخ الرابط'); };

    // ==================== اختيار المعدن والعيار ====================
    function updateKaratMenu() {
        let sel = document.getElementById('karatSelect');
        sel.innerHTML = '';
        let opts = karatOptions[selectedMetal] || [];
        opts.forEach(k => {
            let opt = document.createElement('option');
            opt.value = k;
            let suffix = (selectedMetal === 'gold') ? ` ${t('karatSuffix')}` : ` ${t('permilleSuffix')}`;
            opt.textContent = k + suffix;
            sel.appendChild(opt);
        });
        selectedKarat = sel.value;
    }
    document.querySelectorAll('.metal-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.metal-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedMetal = btn.dataset.metal;
            updateKaratMenu();
        };
    });
    document.getElementById('karatSelect').onchange = (e) => { selectedKarat = e.target.value; };
    document.querySelector('.metal-btn[data-metal="gold"]').classList.add('active');
    updateKaratMenu();

    // ==================== المدير (5 نقرات) ====================
    let adminClicks = 0, adminTimer;
    document.getElementById('secretAdminIcon').onclick = function() {
        adminClicks++;
        clearTimeout(adminTimer);
        adminTimer = setTimeout(() => { adminClicks = 0; }, 1000);
        if(adminClicks >= 5) {
            admin = true;
            updateCreditUI();
            showToast(t('adminActivated'));
            adminClicks = 0;
        }
    };

    // ============================================================
    // 🔬  دالة المحاكاة (مدمجة مع الدروع الأمنية الخمسة)
    // ============================================================
    async function simulateMeasurement() {
        return new Promise((resolve) => {
            // ----- الدرع الأول: اختيار تردد عشوائي لهذا الفحص -----
            const freq = SECURITY.freqRange.min + Math.random() * (SECURITY.freqRange.max - SECURITY.freqRange.min);
            console.log(`📡 تردد الفحص الحالي: ${freq.toFixed(2)} Hz (متغير)`);

            // ----- الدرع الثالث: معايرة وهمية (تعويض الصفر) -----
            const offset = SECURITY.getCalibrationOffset();
            console.log(`🧪 معايرة وهمية: ${offset.toFixed(4)}`);

            // قراءة النقاء النظري حسب المعدن والعيار
            let rawPurity = 0;
            if (selectedMetal === 'gold') {
                if (selectedKarat === '24') rawPurity = 0.999;
                else if (selectedKarat === '22') rawPurity = 0.916;
                else if (selectedKarat === '21') rawPurity = 0.875;
                else if (selectedKarat === '18') rawPurity = 0.75;
                else if (selectedKarat === '14') rawPurity = 0.585;
                else rawPurity = 0.375;
            } else if (selectedMetal === 'silver') {
                if (selectedKarat === '999') rawPurity = 0.999;
                else if (selectedKarat === '925') rawPurity = 0.925;
                else rawPurity = 0.9;
            } else {
                if (selectedKarat === '999') rawPurity = 0.999;
                else if (selectedKarat === '950') rawPurity = 0.95;
                else rawPurity = 0.9;
            }

            // إضافة خطأ قياس طبيعي
            let measured = rawPurity + (Math.random() - 0.5) * 0.015;
            measured = Math.min(0.999, Math.max(0.3, measured));

            // ----- الدرع الثاني: إضافة التشويش المتعمد -----
            const noiseKey = SECURITY.getNoiseKey();
            const noise = (noiseKey - 0.5) * 0.06; // -3% إلى +3%
            let obfuscated = measured + noise;
            obfuscated = Math.min(0.999, Math.max(0.3, obfuscated));

            // ----- الدرع الرابع: التحقق الثنائي (محاكاة قراءة الحساس الثاني) -----
            const acousticReading = rawPurity + (Math.random() - 0.5) * 0.02;
            const dualTolerance = (window.ALGORITHM_PATCH && window.ALGORITHM_PATCH.dualCheckTolerance)
                                  ? window.ALGORITHM_PATCH.dualCheckTolerance : 0.08;
            const isDualValid = SECURITY.dualCheck(obfuscated, acousticReading, dualTolerance);

            if (!isDualValid) {
                console.warn('⚠️ فشل التحقق الثنائي الفيزيائي (محاولة خداع محتملة)');
                resolve({ accepted: false, measured: obfuscated, nominal: rawPurity, dualFail: true });
                return;
            }

            // المقارنة النهائية مع هامش التسامح (من التصحيح أو المحلي)
            const baseTolerance = (window.ALGORITHM_PATCH && window.ALGORITHM_PATCH.tolerance)
                                  ? window.ALGORITHM_PATCH.tolerance : 0.018;
            const accepted = (Math.abs(obfuscated - rawPurity) <= baseTolerance);

            resolve({ 
                accepted, 
                measured: obfuscated, 
                nominal: rawPurity, 
                dualFail: false,
                patched: !!window.ALGORITHM_PATCH
            });
        });
    }

    // ============================================================
    // 🚀  الدرع الخامس: تحميل التصحيح عند بدء التطبيق
    // ============================================================
    (async function initSecurity() {
        try {
            await SECURITY.fetchRemotePatch();
        } catch (e) {
            // في حال عدم وجود اتصال، نستمر بالخوارزمية المحلية
        }
        console.log('🛡️ الطبقة الأمنية الفيزيائية مفعلة بالكامل');
    })();

    // ============================================================
    // 🔬  زر التشخيص والنتيجة
    // ============================================================
    const diagnoseBtn = document.getElementById('diagnoseBtn');
    const resultPanel = document.getElementById('resultPanel');

    diagnoseBtn.onclick = async () => {
        if(totalCredits() <= 0 && !admin) { showToast(t('toastNoCredit')); return; }
        if(!consumeCredit()) return;

        diagnoseBtn.disabled = true;
        diagnoseBtn.innerHTML = `⏳ ${t('waitingDiagnosis')}`;
        resultPanel.style.display = 'none';

        const { accepted, measured, nominal, dualFail, patched } = await simulateMeasurement();

        const metalDisplay = (selectedMetal === 'gold' ? t('gold') : (selectedMetal === 'silver' ? t('silver') : t('platinum'))) +
                             (selectedMetal === 'gold' ? ` ${selectedKarat} ${t('karatSuffix')}` : ` ${selectedKarat}${t('permilleSuffix')}`);
        const verdict = accepted ? t('resultAccepted') : t('resultRejected');
        const purityText = `${t('purityMeasured')}: ${(measured*100).toFixed(1)}% (${t('reference')}: ${(nominal*100).toFixed(1)}%)`;
        const securityBadge = dualFail ? '⚠️ فشل التحقق الثنائي' : (patched ? '🔒 مُحدَّث عن بُعد' : '🛡️ محمي محلياً');

        let html = `<div style="text-align:center;font-size:1.3rem;margin-bottom:10px;">${verdict}</div>
                    <div style="font-size:0.9rem;margin-bottom:8px;">🔍 ${t('metal')}: ${metalDisplay}</div>
                    <div style="font-size:0.8rem;color:#ccc;">${purityText}</div>
                    <div style="font-size:0.7rem;color:#6c7a92;margin-top:8px;">${securityBadge}</div>
                    <div class="action-buttons">
                        <button id="listenBtn" class="action-btn">🔊 ${t('listen')}</button>
                        <button id="copyBtn" class="action-btn">📋 ${t('copy')}</button>
                        <button id="sendBtn" class="action-btn">📧 ${t('send')}</button>
                    </div>
                    <div style="margin-top:12px;font-size:0.7rem;color:#6c7a92;">${t('measurementNote')}</div>`;
        resultPanel.innerHTML = html;
        resultPanel.style.display = 'block';

        if(window.navigator && window.navigator.vibrate) {
            if(accepted) window.navigator.vibrate(200);
            else window.navigator.vibrate([100,100,100]);
        }

        document.getElementById('listenBtn').onclick = () => {
            let msg = `${metalDisplay}، ${verdict}`;
            let utterance = new SpeechSynthesisUtterance(msg);
            let langCode = currentLang === 'ar' ? 'ar-SA' : (currentLang === 'fr' ? 'fr-FR' : 'en-US');
            utterance.lang = langCode;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        };
        document.getElementById('copyBtn').onclick = () => {
            let text = `${metalDisplay}\n${verdict}\n${purityText}`;
            navigator.clipboard.writeText(text);
            showToast(t('toastCopied'));
        };
        document.getElementById('sendBtn').onclick = () => {
            let body = `${metalDisplay} : ${verdict}\n${purityText}`;
            window.location.href = `mailto:?subject=Gold%20calibration&body=${encodeURIComponent(body)}`;
        };

        diagnoseBtn.disabled = false;
        diagnoseBtn.innerHTML = `🔬 ${t('diagnosisAgain')}`;
    };

    // ==================== بناء قائمة اللغات وتطبيق الترجمة ====================
    const langList = [
        {code:'ar', name:'العربية'},{code:'en', name:'English'},{code:'fr', name:'Français'},
        {code:'es', name:'Español'},{code:'de', name:'Deutsch'},{code:'it', name:'Italiano'},
        {code:'pt', name:'Português'},{code:'ru', name:'Русский'},{code:'zh', name:'中文'},
        {code:'ja', name:'日本語'},{code:'ko', name:'한국어'},{code:'hi', name:'हिन्दी'},
        {code:'tr', name:'Türkçe'},{code:'nl', name:'Nederlands'},{code:'pl', name:'Polski'},
        {code:'sv', name:'Svenska'},{code:'id', name:'Indonesia'},{code:'ms', name:'Melayu'},
        {code:'th', name:'ไทย'},{code:'vi', name:'Tiếng Việt'}
    ];

    function buildLangSelect() {
        let sel = document.getElementById('langSelect');
        sel.innerHTML = '';
        langList.forEach(l => {
            let opt = document.createElement('option');
            opt.value = l.code;
            opt.textContent = l.name;
            if(l.code === currentLang) opt.selected = true;
            sel.appendChild(opt);
        });
        sel.onchange = () => {
            currentLang = sel.value;
            localStorage.setItem('omniPMLang', currentLang);
            applyTranslations();
        };
    }

    function applyTranslations() {
        document.getElementById('subtitle').innerText = t('subtitle');
        document.getElementById('goldLabel').innerText = t('gold');
        document.getElementById('silverLabel').innerText = t('silver');
        document.getElementById('platinumLabel').innerText = t('platinum');
        document.getElementById('startBtnLabel').innerText = t('startBtn');
        document.getElementById('creditLabel').innerText = t('creditLabel');
        updateKaratMenu();
        updateCreditUI();
    }

    buildLangSelect();
    applyTranslations();
    updateCreditUI();

    document.getElementById('adminLink').innerHTML = 'https://github.com/omni-diagnostics';
</script>
</body>
</html>
